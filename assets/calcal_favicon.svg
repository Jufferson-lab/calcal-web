<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Gradientes Lazo Verde Limón -->
    <linearGradient id="fav-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6EF6E"/>
      <stop offset="100%" stop-color="#8FAE1E"/>
    </linearGradient>
    <!-- Gradientes Lazo Fucsia Láser -->
    <linearGradient id="fav-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF528A"/>
      <stop offset="100%" stop-color="#B80E42"/>
    </linearGradient>
  </defs>

  <!-- Contenedor redondeado oscuro Carbon Base -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#1A1F24"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(232, 236, 239, 0.15)" stroke-width="1.5"/>

  <!-- Símbolo Infinito Central -->
  <g transform="translate(14, 34) scale(0.20)">
    <!-- Lazo Izquierdo Lime -->
    <polygon points="140,40 250,140 220,140 130,68 60,140 100,140" fill="#D6EF6E"/>
    <path d="M 140,40 C 70,40 20,85 20,140 C 20,195 70,240 140,240 L 155,220 C 95,220 50,185 50,140 C 50,95 95,60 140,60 Z" fill="url(#fav-lime)"/>
    <polygon points="20,140 60,140 100,180 60,195 20,140" fill="#67800E"/>
    <polygon points="140,240 250,140 225,140 130,218 60,140 50,140" fill="#B2D235"/>
    <polygon points="130,218 225,140 250,140 155,220 140,240" fill="#67800E"/>
    <polygon points="210,105 250,140 210,175 180,140" fill="#B2D235"/>

    <!-- Lazo Derecho Fuchsia -->
    <polygon points="340,40 250,140 275,140 350,68 420,140 380,140" fill="#FFA1C2"/>
    <path d="M 340,40 C 410,40 460,85 460,140 C 460,195 410,240 340,240 L 325,220 C 385,220 430,185 430,140 C 430,95 385,60 340,60 Z" fill="url(#fav-fuchsia)"/>
    <polygon points="460,140 420,140 380,180 420,195 460,140" fill="#7C0428"/>
    <polygon points="340,240 250,140 275,140 350,218 420,140 430,140" fill="#E01A59"/>
    <polygon points="350,218 275,140 250,140 325,220 340,240" fill="#7C0428"/>
    <polygon points="290,105 250,140 290,175 320,140" fill="#E01A59"/>

    <!-- Líneas de corte y centro -->
    <line x1="140" y1="40" x2="250" y2="140" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9"/>
    <line x1="340" y1="40" x2="250" y2="140" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9"/>
    <circle cx="250" cy="140" r="10" fill="#FFFFFF"/>
  </g>
</svg>
